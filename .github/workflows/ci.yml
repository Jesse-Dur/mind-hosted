name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mind_test
          POSTGRES_PASSWORD: mind_test
          POSTGRES_DB: mind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mind_test -d mind_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://mind_test:mind_test@localhost:5432/mind_test
      AUTUMN_DISABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Read proposed Bun version
        id: runtime
        run: node -e 'console.log("bun=" + JSON.parse(require("fs").readFileSync("runtime/package.json", "utf8")).dependencies.bun)' >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.runtime.outputs.bun }}
      - name: Install proposed runtime packages
        working-directory: runtime
        run: bun install --frozen-lockfile
      - name: Use the packaged Bun and PM2
        run: echo "$GITHUB_WORKSPACE/runtime/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Install backend dependencies
        run: bun install --frozen-lockfile
      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Run tests, type checks, and production build
        run: bun run test
